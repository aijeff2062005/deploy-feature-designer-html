# Designer module. Run alone with: docker compose -f compose.designer.yml up -d
services:
  huly-mcp:
    build:
      context: ./huly-mcp
    image: platform-huly-mcp:2.2.4
    env_file:
      - path: ../../.env
        required: true
    environment:
      HULY_TOOL_PROFILE: project
      PORT: "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  huly-attachments:
    build:
      context: ./huly-attachments
    image: platform-huly-attachments:0.1.54
    env_file:
      - path: ../../.env
        required: true
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "3002"
      TOOLSETS: issues,attachments
      MCP_AUTO_EXIT: "false"
    volumes:
      - huly-uploads:/tmp/huly-uploads:ro
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(3002,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  designer-api:
    build:
      context: ../..
      dockerfile: services/designer/Dockerfile
    image: platform-designer-api:latest
    env_file:
      - path: ../../.env
        required: true
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      BASIC_MEMORY_MCP_URL: http://basic-memory:8000/mcp
    volumes:
      - platform-storage:/data/storage
      - ../../scripts:/opt/platform/scripts:ro
      - ../../logs:/logs                    # platform/logs/designer-api/
      - huly-uploads:/tmp/huly-uploads
    depends_on:
      postgres:
        condition: service_healthy
      basic-memory:
        condition: service_healthy
      huly-mcp:
        condition: service_healthy
      huly-attachments:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8282/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    restart: unless-stopped
    networks:
      - default
      - wiki-index

  designer-web:
    build:
      context: ../../apps/designer-web
      args:
        VITE_BASE: /designer/
        VITE_API_BASE_URL: /designer/api/v1
    restart: unless-stopped

  designer-test:
    profiles: ["test"]
    image: platform-designer-api:latest   # reuses the designer-api image: no second build
    env_file:
      - path: ../../.env
        required: true
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: platform_test     # never the live "platform" database
      POSTGRES_PORT: "5432"
      AUTH_MODE: "off"          # legacy suites run without login; access rules have their own tests
      STORAGE_BACKEND: local    # tests never write to the real bucket
      LOG_PROJECT_TO_STORAGE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "pip install -q -r requirements-dev.txt && pytest -q --tb=short -p no:cacheprovider"]

volumes:
  huly-uploads:
